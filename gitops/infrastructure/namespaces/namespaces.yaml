apiVersion: v1
kind: Namespace
metadata:
  name: devops-prod
  labels:
    name: devops-prod
    environment: production
    tier: application
    # Enforces network policy constraints and security scanning
    security-zone: trusted
---
apiVersion: v1
kind: Namespace
metadata:
  name: ci-cd
  labels:
    name: ci-cd
    environment: production
    tier: devops-tools
    security-zone: tools
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    name: monitoring
    environment: production
    tier: observability
    security-zone: tools
