apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stockdevops-monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: monitoring-app
    app.kubernetes.io/part-of: stockdevops-gitops
spec:
  project: default
  source:
    repoURL: "https://github.com/mohammedmusa1/stock_Devops.git"
    targetRevision: HEAD
    path: gitops/apps/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - Validate=true
