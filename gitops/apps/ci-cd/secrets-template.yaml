# ==============================================================================
# SECRETS TEMPLATE - STOCKDEVOPS ENTERPRISE CI/CD SECRETS
# WARNING: DO NOT COMMIT REAL RAW BASE64 ENCODED STRINGS TO A PUBLIC GIT REPO.
# In a true enterprise environment, this file would be encrypted via SealedSecrets, 
# or fetched dynamically via Vault/AWS Secrets Manager using External Secrets Operator.
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-credentials
  namespace: ci-cd
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/part-of: stockdevops-ci-cd
type: Opaque
data:
  # Base64 encoded dockerhub username (e.g., 'echo -n "my-dockerhub-user" | base64')
  DOCKER_HUB_USERNAME: bXktZG9ja2VyaHViLXVzZXI=
  
  # Base64 encoded dockerhub personal access token/password
  DOCKER_HUB_PASSWORD: bXktc3VwZXItc2VjdXJlLXRva2VuLXBhc3N3b3Jk
  
  # Base64 encoded GitHub personal access token (used by Jenkins to push image tag updates to GitOps repo)
  GITHUB_PAT: Z2l0aHViX3BhdF8xMjM0NTZhbHBoYW51bWVyaWNzdHJpbmc=
  
  # Resend SMTP Password for pipeline email reports
  SMTP_AUTH_PASSWORD: cmVzZW5kLXNtdHAtYXV0aC1wYXNzd29yZC1zdHJpbmc=
---
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-admin-secret
  namespace: ci-cd
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/part-of: stockdevops-ci-cd
type: Opaque
data:
  # Initial Admin Password (default is usually generated, but can be pre-configured)
  jenkins-admin-password: YWRtaW5fcGFzc3dvcmRfMTIzNDU=
