apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: stockdevops-enterprise-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: stockdevops-monitoring
    release: prometheus
spec:
  groups:
  - name: stockdevops.alerts
    rules:
    # 1. Pod Crash Alert (Detects CrashLoopBackOff)
    - alert: PodCrashLooping
      expr: rate(kube_pod_container_status_restarts_total{namespace="devops-prod"}[5m]) > 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Pod {{ $labels.pod }} is crashing repeatedly"
        description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been restarting repeatedly for more than 2 minutes."

    # 2. Deployment Failure Alert
    - alert: DeploymentFailed
      expr: kube_deployment_status_observed_generation{namespace="devops-prod"} != kube_deployment_spec_replicas
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Deployment Failed or Stuck in Rollout"
        description: "Deployment in namespace {{ $labels.namespace }} has not matched the desired replica count for 5 minutes. The rollout is blocked."

    # 3. ArgoCD Drift Detection Alert
    - alert: GitOpsDriftDetected
      expr: argocd_app_info{sync_status="OutOfSync"} == 1
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: "GitOps Drift Detected on {{ $labels.name }}"
        description: "Application {{ $labels.name }} drifted from Git source of truth. ArgoCD selfHeal should auto-correct this shortly, otherwise manual intervention is needed."

    # 4. Cluster Unhealthy
    - alert: ClusterNodeUnhealthy
      expr: kube_node_status_condition{condition="Ready",status="true"} == 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Kubernetes Node is Unready"
        description: "Node {{ $labels.node }} has been in an unready state for more than 5 minutes."

---
# Alertmanager Configuration (Routes alerts to Resend SMTP)
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: email-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: stockdevops-monitoring
spec:
  route:
    groupBy: ['alertname', 'namespace']
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    receiver: 'devops-email'
  receivers:
  - name: 'devops-email'
    emailConfigs:
    - to: 'devops@stockdevops.com'
      from: 'alerts@stockdevops.com'
      smarthost: 'smtp.resend.com:465'
      authUsername: 'resend'
      authPassword:
        name: resend-smtp-secret
        key: password
      requireTLS: true
      sendResolved: true # Triggers automatic "Recovery" emails once problems resolve
