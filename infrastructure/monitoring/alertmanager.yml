global:
  smtp_smarthost: "${SMTP_HOST:-smtp.gmail.com:587}"
  smtp_from: "${ALERT_EMAIL_FROM:-alerts@stockai.local}"
  smtp_auth_username: "${SMTP_USER:-}"
  smtp_auth_password: "${SMTP_PASSWORD:-}"

route:
  receiver: email-default
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h

receivers:
  - name: email-default
    email_configs:
      - to: "${ALERT_EMAIL_TO:-you@example.com}"
        send_resolved: true
