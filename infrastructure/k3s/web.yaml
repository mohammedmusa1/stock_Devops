apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: name-stock-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: YOUR_REGISTRY/namestock-web:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests: { memory: "128Mi", cpu: "50m" }
            limits: { memory: "512Mi", cpu: "500m" }
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: name-stock-ai
spec:
  selector:
    app: web
  ports:
    - port: 3000
