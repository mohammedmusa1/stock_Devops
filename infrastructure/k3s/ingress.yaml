# k3s includes Traefik by default — use Ingress instead of a second Load Balancer
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: namestock
  namespace: name-stock-ai
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
    - host: yourdomain.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
