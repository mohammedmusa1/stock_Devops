apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: name-stock-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: YOUR_REGISTRY/namestock-api:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests: { memory: "256Mi", cpu: "100m" }
            limits: { memory: "768Mi", cpu: "1000m" }
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: namestock-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: name-stock-ai
spec:
  selector:
    app: api
  ports:
    - port: 4000
