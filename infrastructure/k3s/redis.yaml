apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: name-stock-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
          resources:
            requests: { memory: "64Mi", cpu: "50m" }
            limits: { memory: "192Mi", cpu: "200m" }
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: name-stock-ai
spec:
  selector:
    app: redis
  ports:
    - port: 6379
