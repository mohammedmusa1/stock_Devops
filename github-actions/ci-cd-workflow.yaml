name: StockDevOps CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'gitops/**'
      - 'terraform/**'
      - 'README.md'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and Push API Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/stockdevops-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/stockdevops-api:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Web Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/stockdevops-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/stockdevops-web:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update GitOps Tag
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "github-actions@stockdevops.com"
          sed -i 's/tag: .*/tag: "${{ steps.vars.outputs.sha_short }}"/g' gitops/apps/stockdevops/values-prod.yaml
          git add gitops/apps/stockdevops/values-prod.yaml
          git commit -m "chore(deploy): update release tag to ${{ steps.vars.outputs.sha_short }} [skip ci]" || echo "No changes to commit"
          git push origin main
