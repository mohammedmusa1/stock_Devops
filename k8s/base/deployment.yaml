apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockdevops-app
  labels:
    app: stockdevops-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stockdevops-app
  template:
    metadata:
      labels:
        app: stockdevops-app
    spec:
      containers:
      - name: stockdevops-app
        # This image will be overridden by Kustomize overlays
        image: localhost:5000/stockdevops-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 20
